<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CircleCI Button Test</title>
</head>
<body>
  <main>
    <h1>CircleCI Demo App</h1>
    <p>This is a simple web app for the CircleCI Support Engineer technical challenge.</p>

    <button id="showText">Click me</button>
    <p id="message" aria-live="polite"></p>
  </main>

  <script>
    document.getElementById("showText").addEventListener("click", function () {
      document.getElementById("message").innerText = "Hello from CircleCI!";
    });
  </script>
</body>
</html>
